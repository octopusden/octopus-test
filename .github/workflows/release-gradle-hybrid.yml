name: Release Gradle Hybrid

on:
  repository_dispatch:
    types: release

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@0403c2a3aba8a37e10a36c6a04b0571843f30ea5
    with:
      flow-type: hybrid
      java-version: '21' 
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      register-release-immediately: true
      # Pinned to a released tag, not the octopus-base branch that introduces
      # github-packages-publications: this workflow performs a REAL release, and a real release
      # must not run an unmerged contract. The allowlist keeps the publication guard satisfied
      # meanwhile — the build declares a ~20 MB bootJava fat jar. Both give way to
      # `github-packages-publications: ":bootJava"` once that input reaches a tag (octopus-base#207).
      fat-jar-publication-allowlist: octopus-test
    secrets: inherit
