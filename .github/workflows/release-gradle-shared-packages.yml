name: Release Gradle Shared Packages

# Canary for the github-packages-repository input: a real, non-dry-run release that publishes the
# fat jar to a SHARED GitHub Packages registry rather than this repository's own.
#
# Separate from release-gradle-github-packages.yml rather than replacing its input, because the
# two destinations are different contracts and the unset one is what every repository uses today.
# A release computes and tags one version, so the two cannot be jobs in one file.
#
# Dispatch-only, and that is what lets it pin an octopus-base branch. Nothing triggers a
# dispatch-only workflow, so octopus-base's consumer-verify never hands this input to a commit
# that does not declare it — the failure #56 removed from the Merge Gate, and the same exception
# release-gradle-github-packages.yml ran under until the input reached a tag. Move this pin to the
# release tag once the input ships, for the reason recorded there: a tag cannot be force-pushed or
# deleted out from under this file.
#
# Until the shared registry and its token exist, a dispatch fails on octopus-base's own
# validation, by name, before anything is published. That is the intended readiness check, not a
# defect: the registry has to be created and SHARED_PACKAGES_TOKEN distributed first.
#
# publish-to-nexus is false for the reason the sibling canary gives: both registries refuse to
# re-publish an existing version, so every iteration would otherwise burn an immutable Central
# version and eat the organisation's monthly quota.

on: workflow_dispatch

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@c63e497ca2cfe85f26f50e658340b0597434900a
    with:
      flow-type: public
      java-version: '21'
      publish-to-nexus: false
      github-packages-publications: ":bootJava"
      github-packages-repository: octopusden/octopus-maven-packages
    secrets: inherit
