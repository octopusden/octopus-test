name: Release Gradle GitHub Packages

# Canary for the github-packages-publications input: a real, non-dry-run release that publishes
# the fat jar to GitHub Packages and NOTHING to Maven Central.
#
# publish-to-nexus is false on purpose. Both registries refuse to re-publish an existing version,
# so every iteration of this experiment would otherwise burn an immutable Central version and eat
# into the org's monthly Central quota — the very quota OCTOPUS-2434 exists to protect.
#
# No fat-jar-publication-allowlist: the guard is gated on publish-to-nexus, so turning Central off
# skips it entirely — and it would not be needed anyway, since the guard now applies the same
# routing and stops counting a jar bound for GitHub Packages.
#
# The selector is project-qualified — <project path>:<publication>, ":bootJava" for the root
# project. A bare name is rejected. Quoted because a YAML value starting with a colon parses but
# reads badly.
#
# workflow_dispatch only surfaces workflows present on the default branch, so this file must reach
# main before it can be run. The `uses:` ref is resolved at dispatch time, which means the
# octopus-base branch can be iterated on and re-dispatched without touching this repository again.
#
# This file may pin an octopus-base branch where release-smoke.yml may not: nothing triggers a
# dispatch-only workflow, so octopus-base's consumer-verify never hands this input to a commit
# that does not declare it. That is the failure #56 removed from the Merge Gate.

on: workflow_dispatch

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@add-github-packages-publish
    with:
      flow-type: public
      java-version: '21'
      publish-to-nexus: false
      github-packages-publications: ":bootJava"
    secrets: inherit
