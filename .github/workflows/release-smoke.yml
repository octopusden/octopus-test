name: Release Smoke Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Execute reusable release flows without publish side effects.
  #
  # Every job below passes `secrets: inherit`, deliberately: this suite is the consumer canary
  # for common-java-gradle-release, so it must invoke that workflow the same way real callers do
  # — all of them use `secrets: inherit`. Narrowing to an explicit secret map here would make the
  # canary diverge from the contract it exists to verify, and could hide a missing-secret failure
  # that a real release would hit. `dry-run: true` is what keeps these runs side-effect-free.
  #
  # Every gradle-release job pins the octopus-base BRANCH under test, not a tag, so this suite
  # reports whether that branch breaks anything. Bump them to the tag once it is released.
  #
  # They pass github-packages-publications: bootJava because the build declares a 20 MB fat-jar
  # publication. Routing it is what keeps the Central guard green — the guard applies the same
  # routing, so a jar bound for GitHub Packages is no longer counted against Central. Without it
  # the guard fails, correctly: nothing would have said where that jar belongs.
  release-gradle-public:
    name: release/gradle-public
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@71967161556915aff5b387b4f07c87272476858f
    with:
      flow-type: public
      java-version: "21"
      dry-run: true
      github-packages-publications: bootJava
    secrets: inherit

  release-gradle-hybrid:
    name: release/gradle-hybrid
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@71967161556915aff5b387b4f07c87272476858f
    with:
      flow-type: hybrid
      java-version: "21"
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      dry-run: true
      github-packages-publications: bootJava
    secrets: inherit

  release-gradle-hybrid-docker:
    name: release/gradle-hybrid-docker
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@71967161556915aff5b387b4f07c87272476858f
    with:
      flow-type: hybrid
      java-version: "21"
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      docker-image: octopus-test
      dry-run: true
      github-packages-publications: bootJava
    secrets: inherit

  # Consumer canary for the publish-to-nexus=false contract, i.e. deployable-only repos that
  # ship a docker image and are never consumed as a Maven dependency. Mirrors the
  # hybrid-docker case but opts out of Sonatype publishing. Under dry-run the publish steps
  # are skipped regardless of publish-to-nexus, so this verifies the caller contract — the
  # input is accepted and the build/docker/register path stays green — not the live gating.
  release-gradle-hybrid-docker-no-nexus:
    name: release/gradle-hybrid-docker-no-nexus
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@71967161556915aff5b387b4f07c87272476858f
    with:
      flow-type: hybrid
      java-version: "21"
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      docker-image: octopus-test
      publish-to-nexus: false
      register-release-immediately: true
      dry-run: true
    secrets: inherit

  # Consumer canary for github-packages-publications with Central off entirely. Under dry-run the
  # publish step is skipped, so this checks only that the combination is accepted — a real publish
  # is exercised by release-gradle-github-packages.yml.
  release-gradle-github-packages:
    name: release/gradle-github-packages
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@71967161556915aff5b387b4f07c87272476858f
    with:
      flow-type: hybrid
      java-version: "21"
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      publish-to-nexus: false
      github-packages-publications: bootJava
      dry-run: true
    secrets: inherit

  release-maven-public:
    name: release/maven-public
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@71967161556915aff5b387b4f07c87272476858f
    with:
      flow-type: public
      java-version: "21"
      dry-run: true
    secrets: inherit

  release-maven-hybrid:
    name: release/maven-hybrid
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@71967161556915aff5b387b4f07c87272476858f
    with:
      flow-type: hybrid
      java-version: "21"
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      dry-run: true
    secrets: inherit
