name: Release Smoke Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Execute reusable release flows without publish side effects.
  #
  # Every job below passes `secrets: inherit`, deliberately: this suite is the consumer canary
  # for common-java-gradle-release, so it must invoke that workflow the same way real callers do
  # — all of them use `secrets: inherit`. Narrowing to an explicit secret map here would make the
  # canary diverge from the contract it exists to verify, and could hide a missing-secret failure
  # that a real release would hit. `dry-run: true` is what keeps these runs side-effect-free.
  #
  # Every job here pins a RELEASED octopus-base tag, never an unmerged branch. This suite is
  # reached two ways, and the second one is why: octopus-base's own consumer-verify pushes a
  # branch here with every `octopusden/octopus-base/...@<ref>` rewritten to the commit under test,
  # and it rewrites the ref while leaving `with:` untouched. An input that exists only on some
  # octopus-base feature branch therefore arrives at a workflow that does not declare it, and the
  # whole Merge Gate ends in `startup_failure` — for every octopus-base pull request except the
  # one that owns the branch. Pinning a tag keeps the inputs here a subset of what octopus-base
  # `main` declares, which is the only contract a PR-time canary can hold to.
  #
  # The three Central-publishing jobs allowlist octopus-test for the publication guard: the build
  # declares a ~20 MB bootJava fat jar, and the guard counts it against Central. Routing it with
  # `github-packages-publications: bootJava` is the better answer and returns with
  # octopus-base#207 — the input does not exist on any octopus-base tag yet.
  release-gradle-public:
    name: release/gradle-public
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@970add22880df4580dd03698915a42474a405d92
    with:
      flow-type: public
      java-version: "21"
      dry-run: true
      fat-jar-publication-allowlist: octopus-test
    secrets: inherit

  release-gradle-hybrid:
    name: release/gradle-hybrid
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@970add22880df4580dd03698915a42474a405d92
    with:
      flow-type: hybrid
      java-version: "21"
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      dry-run: true
      fat-jar-publication-allowlist: octopus-test
    secrets: inherit

  release-gradle-hybrid-docker:
    name: release/gradle-hybrid-docker
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@970add22880df4580dd03698915a42474a405d92
    with:
      flow-type: hybrid
      java-version: "21"
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      docker-image: octopus-test
      dry-run: true
      fat-jar-publication-allowlist: octopus-test
    secrets: inherit

  # Consumer canary for the publish-to-nexus=false contract, i.e. deployable-only repos that
  # ship a docker image and are never consumed as a Maven dependency. Mirrors the
  # hybrid-docker case but opts out of Sonatype publishing. Under dry-run the publish steps
  # are skipped regardless of publish-to-nexus, so this verifies the caller contract — the
  # input is accepted and the build/docker/register path stays green — not the live gating.
  # No allowlist: the publication guard does not run when nothing goes to Central.
  release-gradle-hybrid-docker-no-nexus:
    name: release/gradle-hybrid-docker-no-nexus
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@970add22880df4580dd03698915a42474a405d92
    with:
      flow-type: hybrid
      java-version: "21"
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      docker-image: octopus-test
      publish-to-nexus: false
      register-release-immediately: true
      dry-run: true
    secrets: inherit

  # The github-packages-publications canary that stood here belongs with the input it covers:
  # it can only pin an octopus-base branch, and a branch pin here breaks every other
  # octopus-base pull request. octopus-base#207 restores it once the input is on a tag.
  # The dispatch-only release-gradle-github-packages.yml still exercises a real publish.

  release-maven-public:
    name: release/maven-public
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@970add22880df4580dd03698915a42474a405d92
    with:
      flow-type: public
      java-version: "21"
      dry-run: true
    secrets: inherit

  release-maven-hybrid:
    name: release/maven-hybrid
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@970add22880df4580dd03698915a42474a405d92
    with:
      flow-type: hybrid
      java-version: "21"
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      dry-run: true
    secrets: inherit
