name: Sonar

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle:
    name: sonar/gradle
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-sonar.yml@v3.1.0
    with:
      java-version: '21'
      quality-gate-wait: false
    # EXPERIMENT: no `secrets: inherit` here, while the maven job below keeps it.
    # The callee declares `environment: Prod` on its own job, so the token may not
    # need passing at all. The maven job is the control - if gradle authenticates
    # and maven does too, inheritance is redundant for every consumer.

  # The repository root POM is packaging=pom with no modules, so it compiles nothing and the
  # analysis had no source to index. `mvn-parameters` points both the build and the scan at a
  # fixture that does, and reaching it through that input keeps the two invocations provably
  # pointed at the same project.
  maven:
    name: sonar/maven
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-sonar.yml@v3.1.0
    with:
      java-version: '8'
      quality-gate-wait: false
      mvn-parameters: -f sonar-canary-maven/pom.xml
    secrets: inherit


  verify:
    name: sonar/verify
    needs: maven
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Assert the Maven analysis saw every source root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/assert-maven-canary-sources.sh
