name: Test release registration

on:
  workflow_dispatch:
    inputs:
      octopus-repository:
        type: string
        required: true
      release-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-register-release.yml@32a7ddb4c6496fc527917505557511108b7bdbe9
    with:
      octopus-repository: ${{ inputs.octopus-repository }}
      release-version:  ${{ inputs.release-version }}
    secrets: inherit
