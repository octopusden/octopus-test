name: Test release registration

on:
  workflow_dispatch:
    inputs:
      octopus-repository:
        type: string
        required: true
      release-version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-register-release.yml@69dbc4ff04b99297cf7399d5d49a6d57afa5969d
    with:
      octopus-repository: ${{ inputs.octopus-repository }}
      release-version:  ${{ inputs.release-version }}
    secrets: inherit
