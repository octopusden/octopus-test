name: Security Reports

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@fd39bd3e6f5b98c0df96a0cd1724d2221450af30
    with:
      java-version: '21'
      enable-dependency-check: false
