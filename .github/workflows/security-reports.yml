name: Security Reports

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@6f66384eb88f8ab49144b556e6fcd5f1973ae3aa
    with:
      java-version: '21'
      enable-dependency-check: false
