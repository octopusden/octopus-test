name: Security Reports

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@69dbc4ff04b99297cf7399d5d49a6d57afa5969d
    with:
      java-version: '21'
      enable-dependency-check: false
