name: Security Reports

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@3ef2ff84910c14529457d7146caa0fa7446a9d21
    with:
      java-version: '21'
      enable-dependency-check: false
