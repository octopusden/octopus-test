name: Security Reports

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@bdbbc36c6f2417eaf96d2e2f30965cd6d62297eb
    with:
      java-version: '21'
      enable-dependency-check: false
