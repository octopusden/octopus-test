name: Security Reports

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@b26cc47d6af3d986e11a93a4de9e9669d44157a0
    with:
      java-version: '21'
      enable-dependency-check: false
