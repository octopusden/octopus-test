name: Security Reports

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@e6a3edb676b6fcffedfde921ffd52eb892172be4
    with:
      java-version: '21'
      enable-dependency-check: false
