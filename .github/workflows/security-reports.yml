name: Security Reports

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@32a7ddb4c6496fc527917505557511108b7bdbe9
    with:
      java-version: '21'
      enable-dependency-check: false
