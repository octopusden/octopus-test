name: Security Reports

on:
  workflow_call:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@13cc9d020533572210d83dc56849bbf685b5e50b
    with:
      java-version: '21'
      enable-dependency-check: false
