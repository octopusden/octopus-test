name: Check for artifact and register release

on:
  workflow_run:
    workflows: ["Release Gradle Hybrid"]
    types:
      - completed

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-check-and-register-release.yml@c97638fd90b9a84a1bc45442e24905fbaa62b5ff
    if:  "${{ github.event.workflow_run.conclusion == 'success' }}"
    with:
      artifact-pattern: "octopus-test/_VER_/octopus-test-_VER_.jar"
    secrets: inherit
