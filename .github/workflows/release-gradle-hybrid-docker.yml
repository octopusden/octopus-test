name: Release Gradle Hybrid Docker

on:
  repository_dispatch:
    types: release-docker

# packages: write for the ghcr.io push this flow performs.
permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v3.4.1
    with:
      flow-type: hybrid
      java-version: '21'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      docker-image: octopus-test
      register-release-immediately: true
      # bootJava is a ~20 MB unsigned fat jar; Central refuses it ("Missing signature"). Route it
      # to this repository's GitHub Packages instead, as release-gradle-public.yml does (see the
      # comment there); Central receives mavenJava alone.
      github-packages-publications: ":bootJava"
    secrets: inherit
