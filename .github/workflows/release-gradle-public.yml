name: Release Gradle Public

on: workflow_dispatch

# packages: write is what the routed bootJava publication needs; contents: write covers the tag
# and the GitHub release.
permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@d5e17aa90270161b3587bc08d0434ffc03e9f5db
    with:
      flow-type: public
      java-version: '21'
      # The build declares bootJava, a ~20 MB fat jar that is unsigned by design: only mavenJava is
      # signed. Sent to Central, it breaks the publication guard's size rule, and Central refuses a
      # file without a signature. So it goes to this repository's own GitHub Packages registry
      # (github-packages-repository left blank, so the Actions GITHUB_TOKEN is enough), and Central
      # receives mavenJava alone. Same destination and permissions as
      # release-gradle-github-packages.yml, but publish-to-nexus stays on.
      #
      # This replaces the deprecated fat-jar-publication-allowlist. It is also what octopus-base#238's
      # signed checksum check needs: that check refuses an unsigned file bound for Central.
      github-packages-publications: ":bootJava"
    secrets: inherit
