name: Release Maven Hybrid

on:
  repository_dispatch:
    types: release-maven

permissions:
  contents: write

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@a6b15bbea5859234372d50bc95334005a7a7c187
    with:
      flow-type: hybrid
      java-version: '8'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      register-release-immediately: true
    secrets: inherit
