name: Release Maven Hybrid

on:
  repository_dispatch:
    types: release-maven

permissions:
  contents: write

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@980755a49299ec7b5fc89f554da67c31a394b8f1
    with:
      flow-type: hybrid
      java-version: '8'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      register-release-immediately: true
    secrets: inherit
