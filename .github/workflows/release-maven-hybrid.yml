name: Release Maven Hybrid

on:
  repository_dispatch:
    types: release-maven

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@21459a70afbdb10921a835bee99d9fb3d45e271a
    with:
      flow-type: hybrid
      java-version: '8'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      register-release-immediately: true
    secrets: inherit
