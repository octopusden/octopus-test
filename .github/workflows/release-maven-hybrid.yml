name: Release Maven Hybrid

on:
  repository_dispatch:
    types: release-maven

permissions:
  contents: write

jobs:
  release:
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-release.yml@69dbc4ff04b99297cf7399d5d49a6d57afa5969d
    with:
      flow-type: hybrid
      java-version: '8'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      register-release-immediately: true
    secrets: inherit
